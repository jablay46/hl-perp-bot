[project]
name = "hl-perp-bot"
version = "0.1.0"
description = "AI-driven perpetual futures trading bot for Hyperliquid. Paper-first, testnet-verified, live-gated."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "hyperliquid-python-sdk>=0.24.0",
    "python-dotenv>=1.0.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hl-perp-bot = "hlperp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
